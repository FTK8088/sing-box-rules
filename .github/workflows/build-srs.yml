name: Build Sing-box SRS

on:
  schedule:
    - cron: '0 0 * * *'   # 每天 UTC 0 点运行（北京时间早上 8 点）
  workflow_dispatch:       # 允许手动触发

# 防止定时任务和手动任务同时推送，后启动的任务等待前一个任务完成。
concurrency:
  group: build-srs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 允许推送到仓库

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download sing-box binary
        run: |
          # 获取最新版本号
          RAW_VERSION=$(curl -s https://api.github.com/repos/SagerNet/sing-box/releases/latest | grep tag_name | cut -d '"' -f 4)
          SINGBOX_VERSION=${RAW_VERSION#v}
          echo "Latest sing-box version: $SINGBOX_VERSION"

          # 下载 Linux AMD64 版
          curl -L -o sing-box.tar.gz "https://github.com/SagerNet/sing-box/releases/download/${RAW_VERSION}/sing-box-${SINGBOX_VERSION}-linux-amd64.tar.gz"
          tar -xzf sing-box.tar.gz
          mv sing-box-* sing-box
          chmod +x sing-box/sing-box

      - name: Download AWAvenue rule JSON and Compile to SRS
        run: |
          curl -L -o AWAvenue-Ads-Rule-Singbox.json https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/Filters/AWAvenue-Ads-Rule-Singbox.json
          ./sing-box/sing-box rule-set compile --output AWAvenue-Ads-Rule-Singbox.srs AWAvenue-Ads-Rule-Singbox.json

      - name: Change BBC Rules and Compile to SRS
        run: |
          curl -L -o bbc.json https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/refs/heads/sing/geo/geosite/bbc.json
          python3 add_rules.py
          ./sing-box/sing-box rule-set compile --output bbc.srs bbc.json

      - name: Compile direct.json to SRS
        run: |
          ./sing-box/sing-box rule-set compile --output direct.srs direct.json

      - name: Compile proxy_domain.json to SRS
        run: |
          ./sing-box/sing-box rule-set compile --output proxy_domain.srs proxy_domain.json

      - name: Commit and push all SRS files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 自动同步仓库根目录下所有编译产物，新增规则时无需再维护文件列表。
          mapfile -d '' srs_files < <(find . -maxdepth 1 -type f -name '*.srs' -print0)
          if [ "${#srs_files[@]}" -eq 0 ]; then
            echo "No SRS files were generated."
            exit 1
          fi

          git add -f -- "${srs_files[@]}"

          # 即使产物内容未变化，也记录本次编译和同步已经成功执行。
          git commit --allow-empty -m "Auto sync SRS files $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

          # 若运行期间远端分支发生变化，先重放本次提交再推送，避免覆盖远端提交。
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "Push attempt ${attempt} failed; retrying..."
            sleep $((attempt * 2))
          done

          echo "Failed to push SRS files after 3 attempts."
          exit 1
